<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — anthony ung</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#FDFDFB;--ink:#1B1B18;--muted:#76746C;--faint:#A6A49B;--rule:#E9E7E0;--ok:#4F8A6B;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--bg);color:var(--ink);font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
    min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px;line-height:1.6;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:520px;}
  .code{font-size:13px;color:var(--faint);letter-spacing:.06em;text-transform:lowercase;display:flex;align-items:center;gap:9px;margin-bottom:18px;}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--ok);display:inline-block;}
  h1{font-weight:500;font-size:clamp(40px,9vw,64px);letter-spacing:-.03em;line-height:1;margin-bottom:16px;}
  p{font-size:15px;color:#34332d;margin-bottom:28px;max-width:42ch;}
  .links{display:flex;gap:10px;flex-wrap:wrap;}
  a{font-size:13px;color:var(--ink);text-decoration:none;border:1px solid var(--ink);padding:10px 16px;transition:background .18s ease,color .18s ease;}
  a:hover{background:var(--ink);color:var(--bg);}
  a:focus-visible{outline:2px solid var(--ok);outline-offset:3px;}
</style>
</head>
<body>
  <div class="wrap">
    <div class="code"><span class="dot"></span>error 404</div>
    <h1>Page not found</h1>
    <p>That page doesn't exist, or it moved. Let's get you back to something that does.</p>
    <div class="links">
      <a href="/">About</a>
      <a href="/experience">Experience</a>
      <a href="/projects">Projects</a>
    </div>
  </div>
</body>
</html>
