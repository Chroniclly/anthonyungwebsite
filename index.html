<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AnthonyHub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root{
  --bg:#f6f7f9; --surface:#ffffff; --surface-2:#fbfcfd;
  --ink:#1a1d24; --muted:#5b6472; --faint:#8b93a1;
  --border:#e4e7ec; --border-strong:#d3d8e0;
  --accent:#334d8f;
  --red:#c62b2b; --red-bg:#fbeaea;
  --amber:#a15c00; --amber-bg:#fbf1e0;
  --blue:#2258c9; --blue-bg:#e8effb;
  --green:#1c7a45; --green-bg:#e6f3ec;
  --done:#8b93a1;
  --shadow:0 1px 2px rgba(20,25,35,.05),0 2px 8px rgba(20,25,35,.04);
  --c-engr:#b45309; --c-engl:#0f766e; --c-art:#be185d;
  --c-calc:#4338ca; --c-cs:#15803d; --c-phys:#0369a1;
  color-scheme:light;
}
:root:not([data-theme="light"]){@media (prefers-color-scheme:dark){
  --bg:#12151b; --surface:#1b1f27; --surface-2:#20252e;
  --ink:#e8eaed; --muted:#9aa3b0; --faint:#6b7482;
  --border:#2a2f38; --border-strong:#363c47;
  --accent:#93aae8;
  --red:#f0827f; --red-bg:#3a2020;
  --amber:#e0a558; --amber-bg:#39301f;
  --blue:#83aaf2; --blue-bg:#1e2b45;
  --green:#79c99a; --green-bg:#1b3226;
  --done:#6b7482;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 2px 10px rgba(0,0,0,.25);
  --c-engr:#e0964a; --c-engl:#4bb6a6; --c-art:#e879a8;
  --c-calc:#8b94ea; --c-cs:#5cc07f; --c-phys:#4aa6dc;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#12151b; --surface:#1b1f27; --surface-2:#20252e;
  --ink:#e8eaed; --muted:#9aa3b0; --faint:#6b7482;
  --border:#2a2f38; --border-strong:#363c47;
  --accent:#93aae8;
  --red:#f0827f; --red-bg:#3a2020;
  --amber:#e0a558; --amber-bg:#39301f;
  --blue:#83aaf2; --blue-bg:#1e2b45;
  --green:#79c99a; --green-bg:#1b3226;
  --done:#6b7482;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 2px 10px rgba(0,0,0,.25);
  --c-engr:#e0964a; --c-engl:#4bb6a6; --c-art:#e879a8;
  --c-calc:#8b94ea; --c-cs:#5cc07f; --c-phys:#4aa6dc;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans",system-ui,sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased}
img{max-width:100%}
[hidden]{display:none!important}
.wrap{max-width:820px;margin:0 auto;padding-left:16px;padding-right:16px}
h1,h2,h3{font-family:"Archivo",system-ui,sans-serif;text-wrap:balance;margin:0}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
.hbar{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding-block:14px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:9px}
.brand .mark{font-family:"Archivo";font-weight:800;font-size:22px;letter-spacing:-.02em}
.brand .mark .b{color:var(--accent)}
.brand .sub{font-size:12px;color:var(--faint)}
.themebtn{font:inherit;font-size:12px;color:var(--muted);background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:5px 10px;cursor:pointer}
.themebtn:hover{border-color:var(--border-strong)}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding-bottom:12px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:9px 11px;box-shadow:var(--shadow)}
.stat .n{font-family:"Archivo";font-weight:700;font-size:20px;font-variant-numeric:tabular-nums;line-height:1.1}
.stat .l{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-top:2px}
.stat.alert .n{color:var(--red)}
.stat.warn .n{color:var(--amber)}

.controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding-bottom:14px}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:2px}
.seg button{font:inherit;font-size:12.5px;color:var(--muted);background:none;border:0;border-radius:7px;padding:5px 11px;cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff;font-weight:600}
:root[data-theme="dark"] .seg button[aria-pressed="true"]{color:#12151b}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .seg button[aria-pressed="true"]{color:#12151b}}
.chk{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);cursor:pointer;user-select:none}
.chk input{width:15px;height:15px;accent-color:var(--accent)}

.legend{display:flex;flex-wrap:wrap;gap:6px;padding-bottom:16px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;padding:4px 10px;border-radius:999px;border:1px solid var(--border);background:var(--surface);cursor:pointer;color:var(--muted);transition:opacity .12s}
.pill .dot{width:9px;height:9px;border-radius:50%;background:var(--pc)}
.pill[aria-pressed="false"]{opacity:.38;text-decoration:line-through}
.pill .cn{color:var(--ink)}

.group{margin-bottom:22px}
.ghead{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.ghead h2{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.07em}
.ghead .rule{flex:1;height:1px;background:var(--border)}
.ghead .cnt{font-size:11.5px;color:var(--faint);font-variant-numeric:tabular-nums}
.ghead.overdue h2{color:var(--red)}
.ghead.today h2{color:var(--amber)}

.list{display:flex;flex-direction:column;gap:7px}
.item{display:flex;align-items:flex-start;gap:11px;background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--pc,var(--border));border-radius:11px;padding:11px 13px;box-shadow:var(--shadow)}
.item.done{opacity:.62}
.box{flex:none;margin-top:1px;width:19px;height:19px;border:1.5px solid var(--border-strong);border-radius:6px;background:var(--surface-2);cursor:pointer;display:grid;place-items:center;padding:0}
.box svg{width:12px;height:12px;stroke:#fff;stroke-width:3;fill:none;opacity:0}
.item.done .box{background:var(--green);border-color:var(--green)}
.item.done .box svg{opacity:1}
.body{flex:1;min-width:0}
.top{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:2px}
.tag{font-family:"IBM Plex Mono";font-size:10.5px;font-weight:600;letter-spacing:.02em;padding:1px 7px;border-radius:5px;color:#fff;background:var(--pc)}
.grp{font-size:11px;color:var(--faint)}
.newbadge{font-family:"IBM Plex Mono";font-size:9.5px;font-weight:600;color:var(--blue);background:var(--blue-bg);padding:1px 6px;border-radius:5px;letter-spacing:.04em}
.name{font-size:14px;font-weight:500;color:var(--ink);text-decoration:none;overflow-wrap:anywhere}
a.name:hover{text-decoration:underline;text-decoration-color:var(--pc)}
.item.done .name{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--done)}
.meta{display:flex;align-items:center;gap:9px;flex:none;margin-top:1px}
.due{font-family:"IBM Plex Mono";font-size:11.5px;font-weight:600;font-variant-numeric:tabular-nums;padding:2px 8px;border-radius:6px;white-space:nowrap;color:var(--muted);background:var(--surface-2)}
.due.d-over{color:var(--red);background:var(--red-bg)}
.due.d-today{color:var(--amber);background:var(--amber-bg)}
.due.d-soon{color:var(--blue);background:var(--blue-bg)}
.pts{font-family:"IBM Plex Mono";font-size:11px;color:var(--faint);white-space:nowrap}
.del{flex:none;background:none;border:0;color:var(--faint);cursor:pointer;font-size:15px;line-height:1;padding:2px 4px;border-radius:5px}
.del:hover{color:var(--red);background:var(--red-bg)}

.addcard{background:var(--surface);border:1px dashed var(--border-strong);border-radius:12px;padding:13px;margin-bottom:22px}
.addcard h3{font-size:13px;margin-bottom:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.addrow{display:flex;gap:8px;flex-wrap:wrap}
.addrow input,.addrow select{font:inherit;font-size:13px;background:var(--surface-2);color:var(--ink);border:1px solid var(--border);border-radius:8px;padding:8px 10px}
.addrow input.t{flex:1;min-width:160px}
.addrow input[type=date]{color:var(--muted)}
.addbtn{font:inherit;font-size:13px;font-weight:600;background:var(--accent);color:#fff;border:0;border-radius:8px;padding:8px 15px;cursor:pointer}
:root[data-theme="dark"] .addbtn{color:#12151b}
.addbtn:disabled{opacity:.5;cursor:default}

.note{display:flex;gap:9px;align-items:flex-start;font-size:12.5px;color:var(--muted);background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-bottom:16px}
.note b{color:var(--ink);font-weight:600}
.empty{text-align:center;color:var(--faint);font-size:13px;padding:34px 0}
footer{color:var(--faint);font-size:11.5px;text-align:center;padding:8px 0 28px;line-height:1.7}
footer .st{color:var(--muted)}
@media (max-width:560px){.stats{grid-template-columns:repeat(2,1fr)}.meta{margin-top:3px}}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="hbar">
      <div class="brand">
        <span class="mark">Anthony<span class="b">Hub</span></span>
        <span class="sub">Running Start · Fall 2026</span>
      </div>
      <button class="themebtn" id="theme">◐ Theme</button>
    </div>
    <div class="stats" id="stats"></div>
    <div class="controls">
      <div class="seg" id="school">
        <button data-s="all" aria-pressed="true">All</button>
        <button data-s="SCC" aria-pressed="false">Shoreline CC</button>
        <button data-s="HS" aria-pressed="false">Shorewood</button>
      </div>
      <label class="chk"><input type="checkbox" id="hidedone"> Hide done</label>
    </div>
    <div class="legend" id="legend"></div>
  </div>
</header>

<main class="wrap" id="main">
  <div class="note">
    <span>↻</span>
    <div><b>Synced from Canvas</b> via your calendar feeds. <span id="synctime"></span> Check items off as you finish; progress is saved in this browser.</div>
  </div>
  <div class="addcard">
    <h3>Add your own to-do</h3>
    <div class="addrow">
      <input class="t" id="ct" placeholder="e.g. Eagle project write-up, tennis match…" maxlength="90">
      <select id="cc"></select>
      <input type="date" id="cd">
      <button class="addbtn" id="cadd" disabled>Add</button>
    </div>
  </div>
  <div id="groups"></div>
</main>
<footer>
  <span class="st" id="storenote"></span><br>
  Not affiliated with Canvas or the colleges. Due times are 11:59 PM unless noted.
</footer>

<script>
const COURSES={
  ENGR:{name:"Engineering Graphics",code:"ENGR&114",school:"SCC",color:"var(--c-engr)"},
  ENGL:{name:"English Comp I",code:"ENGL&101",school:"SCC",color:"var(--c-engl)"},
  ART:{name:"Art Appreciation",code:"ART&100",school:"SCC",color:"var(--c-art)"},
  CALC:{name:"AP Calculus BC",code:"AP Calc BC",school:"HS",color:"var(--c-calc)"},
  CS:{name:"AP Computer Science",code:"AP CS",school:"HS",color:"var(--c-cs)"},
  PHYS:{name:"AP Physics II",code:"AP Physics II",school:"HS",color:"var(--c-phys)"}
};
const CID={ENGR:2742864,ENGL:2742825,ART:2743066,CALC:38678,CS:38438,PHYS:38316};
const BASE={SCC:"https://shoreline.instructure.com",HS:"https://shorelineschools.instructure.com"};

let ITEMS=[];
const model={checks:{},tasks:[]};
const filters={school:"all",courses:new Set(Object.keys(COURSES)),hideDone:false};

/* ---- data loading (data.json in same folder) ---- */
function itemsFromDocs(docs){
  return docs.filter(d=>d.course&&COURSES[d.course]).map(d=>({
    key:d.key,course:d.course,aid:d.aid||null,name:d.name||"(untitled)",
    pts:(d.pts==null?null:d.pts),due:d.due||null,grp:d.grp||"",
    href:d.href||(d.aid?BASE[COURSES[d.course].school]+"/courses/"+CID[d.course]+"/assignments/"+d.aid:BASE[COURSES[d.course].school]+"/courses/"+CID[d.course]+"/assignments"),
    added:d.added||null
  }));
}
async function loadData(){
  try{
    const r=await fetch("data.json",{cache:"no-store"});
    if(r.ok){const d=await r.json();
      if(d&&Array.isArray(d.items)){ITEMS=itemsFromDocs(d.items);
        if(d.updatedAt)document.getElementById("synctime").textContent="Last update "+fmtAgo(d.updatedAt)+".";}}
  }catch(e){}
  render();
}

/* ---- local persistence ---- */
function lsLoad(){try{const r=localStorage.getItem("anthonyhub");if(r){const o=JSON.parse(r);model.checks=o.checks||{};model.tasks=o.tasks||[];}}catch(e){}}
function save(){try{localStorage.setItem("anthonyhub",JSON.stringify({checks:model.checks,tasks:model.tasks}));}catch(e){}}
document.getElementById("storenote").textContent="Progress saved in this browser.";

/* ---- dates ---- */
function todayISO(){return new Date().toLocaleString("sv-SE").slice(0,10);}
function parse(iso){const [y,m,d]=iso.split("-").map(Number);return new Date(y,m-1,d);}
function daysFrom(iso,base){return Math.round((parse(iso)-parse(base))/864e5);}
function fmtDue(iso){const d=parse(iso);return ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"][d.getDay()]+" "+["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][d.getMonth()]+" "+d.getDate();}
function fmtAgo(iso){const t=Date.parse(iso);if(isNaN(t))return "";const m=Math.round((Date.now()-t)/60000);
  if(m<1)return "just now";if(m<60)return m+" min ago";const h=Math.round(m/60);if(h<24)return h+" hr ago";return Math.round(h/24)+" days ago";}
function bucket(iso,base){
  if(iso===null)return {k:"zself",label:"Self-paced · no set due date",cls:""};
  const dd=daysFrom(iso,base),bd=parse(base),dow=(bd.getDay()+6)%7,endThis=7-dow-1;
  if(dd<0)return {k:"a-over",label:"Overdue",cls:"overdue"};
  if(dd===0)return {k:"b-today",label:"Due today",cls:"today"};
  if(dd===1)return {k:"c-tom",label:"Tomorrow",cls:""};
  if(dd<=endThis)return {k:"d-week",label:"This week",cls:""};
  if(dd<=endThis+7)return {k:"e-next",label:"Next week",cls:""};
  const mo=["January","February","March","April","May","June","July","August","September","October","November","December"][parse(iso).getMonth()];
  return {k:"m"+parse(iso).getFullYear()+String(parse(iso).getMonth()).padStart(2,"0"),label:"Later · "+mo,cls:""};
}
function dueClass(iso,done){if(done||iso===null)return "";const dd=daysFrom(iso,todayISO());return dd<0?"d-over":dd===0?"d-today":dd<=3?"d-soon":"";}

/* ---- render ---- */
function baseDone(it){return !!model.checks[it.key];}
function allRows(){
  const rows=ITEMS.map(it=>({type:"a",key:it.key,course:it.course,name:it.name,pts:it.pts,due:it.due,grp:it.grp,href:it.href,added:it.added,done:baseDone(it)}));
  model.tasks.forEach(t=>rows.push({type:"t",key:t.id,course:t.course||null,name:t.title,pts:null,due:t.due||null,grp:"My to-do",href:null,done:!!t.done}));
  return rows;
}
function visible(rows){return rows.filter(r=>{
  if(r.course){const sc=COURSES[r.course].school;
    if(filters.school!=="all"&&sc!==filters.school)return false;
    if(!filters.courses.has(r.course))return false;
  }else if(filters.school!=="all")return false;
  if(filters.hideDone&&r.done)return false;return true;});}
function renderStats(){
  const base=todayISO(),bd=parse(base),dow=(bd.getDay()+6)%7,endThis=7-dow-1;
  let open=0,week=0,over=0,total=0,done=0;
  allRows().forEach(r=>{total++;if(r.done){done++;return;}
    if(r.due){const dd=daysFrom(r.due,base);if(dd<0)over++;else{open++;if(dd<=endThis)week++;}}else open++;});
  const pct=total?Math.round(done/total*100):0;
  const s=[{n:over,l:"Overdue",c:over?"alert":""},{n:week,l:"Due this week",c:week?"warn":""},{n:open,l:"Open total",c:""},{n:pct+"%",l:"Done",c:""}];
  document.getElementById("stats").innerHTML=s.map(x=>`<div class="stat ${x.c}"><div class="n">${x.n}</div><div class="l">${x.l}</div></div>`).join("");
}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function isNew(a){if(!a)return false;return (Date.now()-Date.parse(a))<3*864e5;}
function render(){
  renderStats();
  const base=todayISO(),rows=visible(allRows()),groups={};
  rows.forEach(r=>{const b=bucket(r.due,base);(groups[b.k]=groups[b.k]||{label:b.label,cls:b.cls,items:[]}).items.push(r);});
  const box=document.getElementById("groups");
  if(!ITEMS.length&&!model.tasks.length){box.innerHTML=`<div class="empty">Loading your assignments…</div>`;return;}
  if(!rows.length){box.innerHTML=`<div class="empty">Nothing here with these filters. 🎉</div>`;return;}
  box.innerHTML=Object.keys(groups).sort().map(k=>{
    const g=groups[k];
    g.items.sort((a,b)=>a.done!==b.done?a.done-b.done:(a.due&&b.due?a.due.localeCompare(b.due)||a.name.localeCompare(b.name):a.name.localeCompare(b.name)));
    const items=g.items.map(r=>{
      const co=r.course?COURSES[r.course]:null,pc=co?co.color:"var(--faint)",tag=co?co.code:"TO-DO";
      const nm=r.href?`<a class="name" href="${r.href}" target="_blank" rel="noopener">${esc(r.name)}</a>`:`<span class="name">${esc(r.name)}</span>`;
      const dueHtml=r.due?`<span class="due ${dueClass(r.due,r.done)}">${fmtDue(r.due)}</span>`:"";
      const ptsHtml=r.pts!=null?`<span class="pts">${r.pts} pt${r.pts===1?"":"s"}</span>`:"";
      const del=r.type==="t"?`<button class="del" data-del="${r.key}" title="Remove">×</button>`:"";
      const nb=(r.type==="a"&&isNew(r.added))?`<span class="newbadge">NEW</span>`:"";
      return `<div class="item ${r.done?"done":""}" style="--pc:${pc}">
        <button class="box" data-k="${r.key}" data-t="${r.type}" role="checkbox" aria-checked="${r.done}" aria-label="Mark done"><svg viewBox="0 0 14 14"><path d="M2 7.5 5.5 11 12 3.5"/></svg></button>
        <div class="body"><div class="top"><span class="tag" style="background:${pc}">${tag}</span><span class="grp">${esc(r.grp)}</span>${nb}</div>${nm}</div>
        <div class="meta">${dueHtml}${ptsHtml}${del}</div></div>`;
    }).join("");
    return `<section class="group"><div class="ghead ${g.cls}"><h2>${g.label}</h2><span class="rule"></span><span class="cnt">${g.items.length}</span></div><div class="list">${items}</div></section>`;
  }).join("");
}

/* ---- events ---- */
document.getElementById("groups").addEventListener("click",e=>{
  const cb=e.target.closest("[data-k]");
  if(cb){const k=cb.dataset.k,t=cb.dataset.t;
    if(t==="t"){const task=model.tasks.find(x=>x.id===k);if(task)task.done=!task.done;}
    else{model.checks[k]=!model.checks[k];}
    save();render();return;}
  const del=e.target.closest("[data-del]");
  if(del){model.tasks=model.tasks.filter(x=>x.id!==del.dataset.del);save();render();}
});
document.getElementById("school").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;
  filters.school=b.dataset.s;[...e.currentTarget.children].forEach(x=>x.setAttribute("aria-pressed",x===b));render();});
document.getElementById("hidedone").addEventListener("change",e=>{filters.hideDone=e.target.checked;render();});
document.getElementById("theme").addEventListener("click",()=>{const r=document.documentElement;
  const cur=r.getAttribute("data-theme")||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light");
  r.setAttribute("data-theme",cur==="dark"?"light":"dark");});
function buildLegend(){
  const L=document.getElementById("legend");
  L.innerHTML=Object.entries(COURSES).map(([k,c])=>`<button class="pill" data-c="${k}" aria-pressed="true" style="--pc:${c.color}"><span class="dot"></span><span class="cn">${c.code}</span></button>`).join("");
  L.addEventListener("click",e=>{const b=e.target.closest(".pill");if(!b)return;
    const k=b.dataset.c,on=b.getAttribute("aria-pressed")==="true";b.setAttribute("aria-pressed",!on);
    if(on)filters.courses.delete(k);else filters.courses.add(k);render();});
}
function buildSelect(){document.getElementById("cc").innerHTML=`<option value="">No class</option>`+Object.entries(COURSES).map(([k,c])=>`<option value="${k}">${c.code}</option>`).join("");}
const ct=document.getElementById("ct"),cadd=document.getElementById("cadd");
ct.addEventListener("input",()=>cadd.disabled=!ct.value.trim());
function addTask(){const title=ct.value.trim();if(!title)return;
  model.tasks.push({id:"t"+Date.now().toString(36),title,course:document.getElementById("cc").value||null,due:document.getElementById("cd").value||null,done:false});
  ct.value="";document.getElementById("cd").value="";cadd.disabled=true;save();render();}
cadd.addEventListener("click",addTask);
ct.addEventListener("keydown",e=>{if(e.key==="Enter")addTask();});

/* ---- boot ---- */
lsLoad();buildLegend();buildSelect();render();loadData();
</script>
